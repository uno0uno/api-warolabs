# tbls config — https://github.com/k1LoW/tbls
#
# Read-only schema introspection. Generates dbdoc/ from the live Postgres
# database via SSH tunnel. Re-run after any migration that lands in prod:
#
#   ssh -L 5432:localhost:5432 warolabs-hostinger -N & # if tunnel not up
#   set -a && source .env && set +a
#   export TBLS_DSN="postgres://${NUXT_PRIVATE_DB_USER}:${NUXT_PRIVATE_DB_PASSWORD}@host.docker.internal:5432/${NUXT_PRIVATE_DB_NAME}?sslmode=disable"
#   docker run --rm -v "$PWD:/work" -w /work -e TBLS_DSN ghcr.io/k1low/tbls:latest doc -f

dsn: env://TBLS_DSN
docPath: dbdoc

er:
  format: mermaid

# Post-generation cleanup. Two manual steps tbls itself does not handle:
#
# (a) Drop per-table SVG diagrams (tbls auto-generates them when Graphviz
#     `dot` is on PATH; they duplicate info already in the .md files).
#       find dbdoc -name "*.svg" -delete
#
# (b) Remove two empty migration-tracking tables left over from earlier
#     Prisma/Drizzle setups — neither tracks anything in this database.
#     tbls v1.94.5 does not honor `exclude:` for tables that exist, so:
#       rm -f dbdoc/public._prisma_migrations.md dbdoc/drizzle.__drizzle_migrations.md
#       sed -i '' -E '/\[(drizzle.__drizzle_migrations|public._prisma_migrations)\]/d' dbdoc/README.md
