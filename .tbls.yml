# tbls config — https://github.com/k1LoW/tbls
#
# Read-only schema introspection. Generates dbdoc/ from the live Postgres
# database via SSH tunnel. Re-run after any migration that lands in prod:
#
#   ssh -L 5432:localhost:5432 warolabs -N &           # if tunnel not up
#   set -a && source .env && set +a
#   export TBLS_DSN="postgres://${NUXT_PRIVATE_DB_USER}:${NUXT_PRIVATE_DB_PASSWORD}@host.docker.internal:5432/${NUXT_PRIVATE_DB_NAME}?sslmode=disable"
#   docker run --rm -v "$PWD:/work" -w /work -e TBLS_DSN ghcr.io/k1low/tbls:latest doc -f

dsn: env://TBLS_DSN
docPath: dbdoc

er:
  format: mermaid

# Note on noise: the database contains two empty migration-tracking tables
# (`public._prisma_migrations`, `drizzle.__drizzle_migrations`) from earlier
# Prisma/Drizzle setups that never tracked anything here. tbls v1.94.5 does
# not honor `exclude:` for tables that exist — remove them after generation:
#
#   rm -f dbdoc/public._prisma_migrations.{md,svg} \
#         dbdoc/drizzle.__drizzle_migrations.{md,svg}
#   sed -i '' -E '/\[(drizzle.__drizzle_migrations|public._prisma_migrations)\]/d' dbdoc/README.md
